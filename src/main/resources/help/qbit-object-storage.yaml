    Changes affect the default header policy. Use **{{label:objectStorageApplyHeaderPolicyToBucket}}** to update existing files. A custom policy configured by your administrator may bypass these rules. You need storage administrator access.

- key: process:object_storage_header_rule.bulkDelete;slot:help
  summary: Delete selected rules after reviewing the selection.
  content: |
    Review the selected rules before continuing. Deleting rules does not delete stored files.

    Changes affect the default header policy. Use **{{label:objectStorageApplyHeaderPolicyToBucket}}** to update existing files. A custom policy configured by your administrator may bypass these rules. You need storage administrator access.

- key: process:object_storage_protection_rule.bulkInsert;slot:help
  summary: Import new rules from an uploaded file.
  content: |
    Upload your rules and map the columns to the rule fields. Review the proposed records and any validation errors before continuing.

    Changes affect which files your protection rules guard. Removing a rule removes that protection; review its bucket and path carefully. You need storage administrator access.

